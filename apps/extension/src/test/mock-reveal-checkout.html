<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Reveal checkout regression</title>
  </head>
  <body>
    <main id="checkout"></main>
    <script>
      const cached = new URL(location.href).searchParams.has("cached");
      window.testedCodes = [];
      setTimeout(() => {
        document.getElementById("checkout").innerHTML =
          '<div data-test="cart-summary-total">$100.00</div><button id="add-promo-code-btn">Add promo code</button>';
        document.getElementById("add-promo-code-btn").onclick = () => {
          document.getElementById("add-promo-code-btn").remove();
          document
            .getElementById("checkout")
            .insertAdjacentHTML(
              "beforeend",
              '<input data-test="promo-code-input"><button data-test="apply-promo-code-button">Apply</button><div id="promoCodeEntry--ErrorMessage" hidden>Invalid code</div>',
            );
          document.querySelector(
            '[data-test="apply-promo-code-button"]',
          ).onclick = () => {
            const button = document.querySelector(
              '[data-test="apply-promo-code-button"]',
            );
            const code = document.querySelector("input").value;
            window.testedCodes.push(code);
            if (cached)
              setTimeout(() => {
                button.disabled = true;
              }, 20);
            else button.disabled = true;
            if (!cached)
              document.getElementById("promoCodeEntry--ErrorMessage").hidden =
                true;
            setTimeout(
              () => {
                if (code === "WORKS10")
                  document.querySelector(
                    '[data-test="cart-summary-total"]',
                  ).innerHTML =
                    '<span aria-hidden="true">$100.00</span><strong>$90.00</strong>';
                else
                  document.getElementById(
                    "promoCodeEntry--ErrorMessage",
                  ).hidden = false;
                button.disabled = false;
              },
              cached ? 70 : 4500,
            );
          };
        };
      }, 1500);
    </script>
  </body>
</html>
