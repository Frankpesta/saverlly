<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Saverlly</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <header class="popup__header">
        <img class="popup__logo" src="assets/design-logo.svg" alt="Saverlly" />
        <!-- Shown only while an admin store setup session is active; shoppers never see it. Sits
             in the header's free space so it adds no height to the popup. -->
        <button class="popup__setup-pill" id="setup-pill" type="button" hidden></button>
        <button class="popup__close" id="close-btn" aria-label="Close" type="button"><img src="assets/design-close.svg" alt="" /></button>
      </header>
      <div class="popup__lifetime">
        <img class="popup__lifetime-icon" src="assets/design-gift.svg" alt="" />
        <span>Lifetime Saved: <span id="lifetime-value"> </span></span>
      </div>
      <main id="content" class="popup__content" aria-live="polite" aria-atomic="true">
        <p class="popup__subtext">Checking this page…</p>
      </main>
      <!-- Sits outside #content so a promo survives every view re-render (idle/applying/success/…)
           rather than being wiped whenever render() replaces the main panel. Stays empty and
           takes up no space when there is no active promotion for this device. -->
      <aside id="promo" class="popup__promo" hidden></aside>
      <!-- Chrome Web Store policy: the affiliate relationship must be disclosed in the extension's
           own UI. The Figma frames have no settings menu to hold it (the extension has no
           account or settings), so it stays as this footer. -->
      <footer class="popup__disclosure">
        <a href="#" id="disclosure-link">Learn how Saverlly earns money</a>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
