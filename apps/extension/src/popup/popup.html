<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Saverlly</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <header class="popup__header">
        <span class="popup__brand">
          <img class="popup__logo" src="assets/design-logo.svg" alt="Saverlly" />
        </span>
        <button class="popup__close" id="close-btn" aria-label="Close" type="button"><img src="assets/design-close.svg" alt="" /></button>
      </header>
      <div class="popup__lifetime">
        <img class="popup__lifetime-icon" src="assets/gift-icon.png" alt="" />
        <span class="popup__lifetime-label">Lifetime Saved:</span>
        <span class="popup__lifetime-value" id="lifetime-value"> </span>
      </div>
      <main id="content" class="popup__content" aria-live="polite" aria-atomic="true">
        <p class="popup__subtext">Checking this page…</p>
      </main>
      <!-- Sits outside #content so a promo survives every view re-render (idle/applying/success/…)
           rather than being wiped whenever render() replaces the main panel. Stays empty and
           takes up no space when there is no active promotion for this device. -->
      <aside id="promo" class="popup__promo" hidden></aside>
      <footer class="popup__disclosure">
        <a href="#" id="disclosure-link">Learn how Saverlly earns money</a>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
